name: Pokerayou Tracker

permissions:
  contents: write

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node tracker.js

      - name: Save data
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker@github.com"
          git add data.json
          git commit -m "Update pokedex data" || exit 0
          git push
