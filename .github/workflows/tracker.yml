name: Pokerayou Tracker

on:
  schedule:
    - cron: "*/30 * * * *" # toutes les 10 minutes
  workflow_dispatch:

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tracker
        run: node tracker.js

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/*.json
          git commit -m "update pokedex data" || echo "No changes"
          git push
