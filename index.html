<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <title>Pokédex – Mastu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #121212;
      color: #fff;
      padding: 1.5rem;
    }

    h1 {
      text-align: center;
      margin-bottom: .5rem;
    }

    .meta {
      text-align: center;
      margin-bottom: 1rem;
      opacity: .8;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: .75rem;
    }

    .pokemon {
      background: #1e1e1e;
      border-radius: 12px;
      padding: .5rem;
      text-align: center;
      border: 2px solid #333;
      box-shadow: 4px 4px 0 rgba(0, 0, 0, .5);
      transition: transform .1s;
    }

    .pokemon:hover {
      transform: translateY(-2px);
    }

    .pokemon img {
      width: 80px;
      height: 80px;
      object-fit: contain;
    }

    .name {
      font-size: .85rem;
      font-weight: bold;
    }

    .id {
      font-size: .7rem;
      opacity: .7;
    }

    /* États */
    .caught {
      border-color: #2ecc71;
    }

    .seen {
      border-color: #f1c40f;
    }

    .shiny {
      border-color: #9b59b6;
      background: linear-gradient(135deg, #9b59b6, #8e44ad);
    }
  </style>
</head>

<body>

  <h1>Pokédex – Mastu</h1>
  <div class="meta" id="meta">Chargement…</div>

  <div class="grid" id="grid"></div>

  <script src="script.js"></script>
</body>

</html>
