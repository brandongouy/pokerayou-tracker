<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <title>Pokédex – Mastu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #121212;
      color: #fff;
      padding: 1.5rem;
    }

    h1 {
      text-align: center;
      margin-bottom: .5rem;
    }

    .meta {
      text-align: center;
      margin-bottom: 1rem;
      opacity: .8;
    }

    .filters {
      display: flex;
      justify-content: center;
      gap: .5rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .filters button {
      border-radius: 999px;
      padding: .35rem .9rem;
      border: 2px solid transparent;
      background: #1e1e1e;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
      opacity: .7;
    }

    .filters button.active {
      opacity: 1;
      transform: scale(1.05);
    }

    /* Couleurs filtres */
    .filters .caught {
      border-color: #2ecc71;
      color: #2ecc71;
    }

    .filters .seen {
      border-color: #f1c40f;
      color: #f1c40f;
    }

    .filters .shiny {
      border-color: #9b59b6;
      color: #9b59b6;
    }

    .filters .missing {
      border-color: #7f8c8d;
      color: #7f8c8d;
    }

    .filters .active.caught {
      background: #2ecc71;
      color: #000;
    }

    .filters .active.seen {
      background: #f1c40f;
      color: #000;
    }

    .filters .active.shiny {
      background: #9b59b6;
      color: #fff;
    }

    .filters .active.missing {
      background: #7f8c8d;
      color: #fff;
    }

    .filters .active.all {
      background: #ff3a3a;
      color: #000;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: .75rem;
    }

    .pokemon {
      background: #1e1e1e;
      border-radius: 12px;
      padding: .5rem;
      text-align: center;
      border: 2px solid #333;
      box-shadow: 4px 4px 0 rgba(0, 0, 0, .5);
      transition: transform .1s;
    }

    .pokemon:hover {
      transform: translateY(-2px);
    }

    .pokemon img {
      width: 80px;
      height: 80px;
      object-fit: contain;
    }

    .name {
      font-size: .85rem;
      font-weight: bold;
    }

    .id {
      font-size: .7rem;
      opacity: .7;
    }

    /* États */
    .caught {
      border-color: #2ecc71;
      background-color: (46, 204, 113, 0.5);
    }

    .seen {
      border-color: #f1c40f;
      background-color: (241, 196, 15, 0.5);
    }

    .shiny {
      border-color: #9b59b6;
      /*background: linear-gradient(135deg, #9b59b6, #8e44ad);*/
      background-color: (155, 89, 182, 0.5);
    }
  </style>
</head>

<body>

  <h1>Pokédex – Mastu</h1>
  <div class="meta" id="meta">Chargement…</div>

  <div class="filters">
    <button data-filter="all" class="active all">Tous</button>
    <button data-filter="caught" class="caught">Capturés</button>
    <button data-filter="seen" class="seen">Vus</button>
    <button data-filter="shiny" class="shiny">Shiny</button>
    <button data-filter="missing" class="missing">Manquants</button>
  </div>

  <div class="grid" id="grid"></div>

  <script src="script.js"></script>
</body>

</html>
