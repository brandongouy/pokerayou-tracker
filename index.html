<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <title>Pokédex – Mastu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #121212;
      color: #fff;
      padding: 2rem;
    }

    h1,
    h2 {
      text-align: center;
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    .meta {
      text-align: center;
      margin-bottom: 1rem;
      opacity: 0.8;
    }

    .lists {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1rem;
    }

    .card {
      background: #1e1e1e;
      border: 3px solid #ff3a3a;
      border-radius: 14px;
      padding: 1rem;
      box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.5);
    }

    .pokemon {
      display: flex;
      align-items: center;
      gap: .75rem;
      margin-bottom: .5rem;
    }

    .pokemon img {
      width: 56px;
      height: 56px;
      image-rendering: pixelated;
    }

    .pokemon span {
      text-transform: capitalize;
    }

    .shiny {
      background: linear-gradient(135deg, #ffd700, #ff9f00);
      color: #000;
      border-radius: 8px;
      padding: .3rem .5rem;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Pokédex – Mastu</h1>
    <div class="meta" id="meta">Chargement…</div>

    <div class="lists">
      <div class="card">
        <h2>🟢 Capturés</h2>
        <div id="caught"></div>
      </div>

      <div class="card">
        <h2>👀 Vus</h2>
        <div id="seen"></div>
      </div>

      <div class="card">
        <h2>✨ Shiny</h2>
        <div id="shiny"></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
