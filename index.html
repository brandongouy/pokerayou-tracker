<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <title>Pokédex – Mastu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #121212;
      color: #fff;
      padding: 2rem;
    }

    h1 {
      text-align: center;
    }

    .meta {
      text-align: center;
      margin-bottom: 1rem;
      opacity: 0.8;
    }

    .filters {
      display: flex;
      justify-content: center;
      gap: .5rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .filters button {
      background: #1e1e1e;
      color: #fff;
      border: 2px solid #ff3a3a;
      border-radius: 999px;
      padding: .4rem .9rem;
      cursor: pointer;
    }

    .filters button.active {
      background: #ff3a3a;
      color: #000;
      font-weight: bold;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: .75rem;
    }

    .pokemon {
      background: #1e1e1e;
      border-radius: 12px;
      padding: .5rem;
      text-align: center;
      border: 2px solid transparent;
      box-shadow: 4px 4px 0 rgba(0, 0, 0, .5);
    }

    .pokemon img {
      width: 72px;
      height: 72px;
      image-rendering: pixelated;
    }

    .pokemon .name {
      font-size: .9rem;
      text-transform: capitalize;
    }

    .pokemon .id {
      font-size: .75rem;
      opacity: .7;
    }

    .pokemon.shiny {
      border-color: gold;
      background: linear-gradient(135deg, #ffd700, #ff9f00);
      color: #000;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>Pokédex – Mastu</h1>
  <div class="meta" id="meta">Chargement…</div>

  <div class="filters">
    <button data-filter="all" class="active">Tout</button>
    <button data-filter="caught">Capturés</button>
    <button data-filter="seen">Vus</button>
    <button data-filter="shiny">Shiny</button>
  </div>

  <div class="grid" id="grid"></div>

  <script src="script.js"></script>
</body>

</html>
